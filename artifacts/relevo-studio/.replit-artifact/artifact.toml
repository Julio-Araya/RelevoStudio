kind = "web"
previewPath = "/"
title = "Relevo Studio"
description = "Single-page landing site for Relevo Studio, an applied AI studio based in Santiago, Chile. A credential-confirmation page for prospects who receive a proposal or demo — four focused sections, dark aesthetic, animated 'relevo' bar element, no backend."
version = "1.0.0"
id = "artifacts/relevo-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21483

[services.development]
run = "pnpm --filter @workspace/relevo-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/relevo-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/relevo-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21483"
BASE_PATH = "/"
